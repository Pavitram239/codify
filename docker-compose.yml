services:
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_FRONTEND_ORIGIN: ${VITE_FRONTEND_ORIGIN:-http://localhost:3185/api/v1}
    ports:
      - "${CLIENT_HOST_PORT:-5185}:80"
    depends_on:
      django-server:
        condition: service_healthy
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3100
      ALL_IP: 0.0.0.0
      MONGO_URI: ${DOCKER_MONGO_URI}
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://localhost:5185}
      JUDGE0_BASE_URL: http://judge0-server:2358
      JUDGE0_TOKEN: ${JUDGE0_TOKEN}
      RABBITMQ_URL: amqp://judge0:judge0_rabbitmq_password_123@rabbitmq:5672
    ports:
      - "3101:3100"
    profiles:
      - legacy-node
    depends_on:
      mongo:
        condition: service_healthy
      judge0-server:
        condition: service_started
    restart: unless-stopped

  submission-worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["node", "worker/codeexecution.js"]
    profiles:
      - legacy-node
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGO_URI: ${DOCKER_MONGO_URI}
      JUDGE0_BASE_URL: http://judge0-server:2358
      JUDGE0_TOKEN: ${JUDGE0_TOKEN}
      RABBITMQ_URL: amqp://judge0:judge0_rabbitmq_password_123@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      judge0-server:
        condition: service_started
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: judge0
      RABBITMQ_DEFAULT_PASS: judge0_rabbitmq_password_123
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  judge0-server:
    image: ${JUDGE0_IMAGE:-judge0/judge0:latest}
    privileged: true
    ports:
      - "2358:2358"
    volumes:
      - ./judge0.conf:/api/judge0.conf:ro
    environment:
      AUTHN_TOKEN: ${JUDGE0_TOKEN}
    depends_on:
      judge0-db:
        condition: service_started
      judge0-redis:
        condition: service_started
    restart: unless-stopped

  judge0-worker:
    image: ${JUDGE0_IMAGE:-judge0/judge0:latest}
    user: ${JUDGE0_WORKER_USER:-judge0}
    command:
      - bash
      - -c
      - "if [ \"$$(id -u)\" -eq 0 ]; then printf 'root ALL=(ALL) NOPASSWD: ALL\\n' >> /etc/sudoers; fi; exec ./scripts/workers"
    privileged: true
    volumes:
      - ./judge0.conf:/api/judge0.conf:ro
    environment:
      AUTHN_TOKEN: ${JUDGE0_TOKEN}
      COUNT: ${JUDGE0_WORKER_COUNT:-2}
    depends_on:
      judge0-db:
        condition: service_started
      judge0-redis:
        condition: service_started
    restart: unless-stopped

  judge0-db:
    image: postgres:16.2
    env_file:
      - judge0.conf
    volumes:
      - judge0-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  judge0-redis:
    image: redis:7.2.4
    command: ["sh", "-c", "redis-server --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    env_file:
      - judge0.conf
    volumes:
      - judge0-redis-data:/data
    restart: unless-stopped

  # ── Django stack (Phase 2+) ───────────────────────────────────────────────
  postgres:
    image: postgres:16.2
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-code_assessment}
      POSTGRES_USER: ${POSTGRES_USER:-code_assessment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-code_assessment_dev_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-code_assessment}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  django-redis-cache:
    image: redis:7.2.4
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6380:6379"
    restart: unless-stopped

  django-server:
    build:
      context: .
      dockerfile: django_backend/Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-code_assessment}
      POSTGRES_USER: ${POSTGRES_USER:-code_assessment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-code_assessment_dev_password}
      POSTGRES_PORT: 5432
      REDIS_URL: redis://django-redis-cache:6379/0
      RABBITMQ_URL: amqp://judge0:judge0_rabbitmq_password_123@rabbitmq:5672
      JUDGE0_BASE_URL: http://judge0-server:2358
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://localhost:5185}
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,django-server"
    ports:
      - "${DJANGO_API_HOST_PORT:-3185}:8000"
      - "${DJANGO_HOST_PORT:-8185}:8000"
    volumes:
      - django-media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/auth/csrf', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      django-redis-cache:
        condition: service_started
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: django_backend/Dockerfile
    command: ["celery", "-A", "config.celery", "worker", "--loglevel=info", "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}"]
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "false"
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-code_assessment}
      POSTGRES_USER: ${POSTGRES_USER:-code_assessment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-code_assessment_dev_password}
      POSTGRES_PORT: 5432
      REDIS_URL: redis://django-redis-cache:6379/0
      RABBITMQ_URL: amqp://judge0:judge0_rabbitmq_password_123@rabbitmq:5672
      JUDGE0_BASE_URL: http://judge0-server:2358
    volumes:
      - django-media:/app/media
    depends_on:
      django-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      django-redis-cache:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: django_backend/Dockerfile
    command: ["celery", "-A", "config.celery", "beat", "--loglevel=info"]
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "false"
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-code_assessment}
      POSTGRES_USER: ${POSTGRES_USER:-code_assessment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-code_assessment_dev_password}
      POSTGRES_PORT: 5432
      REDIS_URL: redis://django-redis-cache:6379/0
      RABBITMQ_URL: amqp://judge0:judge0_rabbitmq_password_123@rabbitmq:5672
    depends_on:
      django-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
  judge0-db-data:
  judge0-redis-data:
  postgres-data:
  django-media:
